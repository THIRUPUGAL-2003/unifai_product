services:
  # Production path for employees = Guard EXE on each laptop (local MitM via RAKSHA_PROXY_ADDR) → this Raksha backend.
  # Optional shared/network proxy (lab/office PAC) — enable with:
  #   docker compose --profile network-proxy up -d raksha_browser_ai_proxy
  # Secrets and environment-specific hosts MUST come from .env — no hardcoded fallbacks.
  raksha_tech:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.local
    image: raksha-local:latest
    container_name: ${CONTAINER_NAME:?set CONTAINER_NAME in .env}
    user: "0:0"
    env_file:
      - .env
    environment:
      - APP_DIR=${APP_DIR:-/app/data}
      - APP_PORT=${APP_PORT:?set APP_PORT in .env}
      - APP_HOST=${APP_HOST:-0.0.0.0}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_STYLE=${LOG_STYLE:-json}
      - SERVER_DOMAIN=${SERVER_DOMAIN:?set SERVER_DOMAIN in .env}
      - DB_TYPE=${DB_TYPE:-postgres}
      - DB_HOST=${DB_HOST:?set DB_HOST in .env}
      - DB_PORT=${DB_PORT:?set DB_PORT in .env}
      - DB_NAME=${DB_NAME:?set DB_NAME in .env}
      - DB_USER=${DB_USER:?set DB_USER in .env}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env}
      - DB_SSL_MODE=${DB_SSL_MODE:-disable}
      - ADMIN_EMAIL=${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      - BROWSER_AI_OLLAMA_URL=${OLLAMA_URL:?set OLLAMA_URL in .env}
      - OLLAMA_URL=${OLLAMA_URL:?set OLLAMA_URL in .env}
      - RAKSHA_GUARD_SECRET=${RAKSHA_GUARD_SECRET:?set RAKSHA_GUARD_SECRET in .env}
      - RAKSHA_GUARD_REQUIRE_SECRET=${RAKSHA_GUARD_REQUIRE_SECRET:-1}
      - RAKSHA_PAC_ALLOW_QUERY_PROXY=${RAKSHA_PAC_ALLOW_QUERY_PROXY:-0}
      - RAKSHA_PRODUCT_NAME=${RAKSHA_PRODUCT_NAME:-Raksha}
      - RAKSHA_PRODUCT_SUBTITLE=${RAKSHA_PRODUCT_SUBTITLE:-Real-time AI Knowledge Screening & Hazard Audit}
      - RAKSHA_COMPANY_NAME=${RAKSHA_COMPANY_NAME:-YesPanchi Group of Companies}
      - RAKSHA_COMPANY_SHORT_NAME=${RAKSHA_COMPANY_SHORT_NAME:-YesPanchi}
      - RAKSHA_COMPANY_LOGO=${RAKSHA_COMPANY_LOGO:-/yes-panchi-logo.png}
      - RAKSHA_FOOTER_COPYRIGHT=${RAKSHA_FOOTER_COPYRIGHT:-}
      - RAKSHA_FOOTER_SUBTITLE=${RAKSHA_FOOTER_SUBTITLE:-Enterprise AI Governance Platform.}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - ollama
    ports:
      - "${APP_PORT:?set APP_PORT in .env}:${APP_PORT:?set APP_PORT in .env}"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
      - ./apps/browser-guard/release:/app/release
      # Guard code published to installed Guards by Browser AI → Setup → Rebuild & Publish.
      - ./apps/browser-guard/proxy:/app/guard-proxy:ro
      - ./apps/browser-guard/agent:/app/guard-agent:ro
      # Keep config.json inside ./data only. Do not also bind-mount a single file onto
      # /app/data/config.json — that breaks atomic rename saves (device or resource busy).
    restart: unless-stopped

  # LAB / optional network Guard proxy — OFF by default (laptop Guard EXE is enough).
  # Enable only when you need office PAC/GPO → shared proxy:
  #   docker compose --profile network-proxy up -d raksha_browser_ai_proxy
  # Point PAC to: https://<backend>/api/browser-ai/pac?proxy=<this-host>:${PROXY_PORT}
  # Container name: NETWORK_PROXY_CONTAINER_NAME in .env (default raksha_browser_ai_proxy).
  raksha_browser_ai_proxy:
    profiles:
      - network-proxy
    image: mitmproxy/mitmproxy:latest
    container_name: ${NETWORK_PROXY_CONTAINER_NAME:-raksha_browser_ai_proxy}
    command: mitmdump -s /app/proxy/browser_ai_proxy.py -p ${PROXY_PORT:?set PROXY_PORT in .env} --set listen_host=0.0.0.0 --set block_global=false --set ssl_insecure=true --set ignore_hosts='^(localhost|127\.0\.0\.1|${CONTAINER_NAME:?set CONTAINER_NAME in .env})'
    environment:
      - RAKSHA_BACKEND_URL=http://${CONTAINER_NAME:?set CONTAINER_NAME in .env}:${APP_PORT:?set APP_PORT in .env}
      - RAKSHA_GUARD_SECRET=${RAKSHA_GUARD_SECRET:?set RAKSHA_GUARD_SECRET in .env}
      - RAKSHA_FAIL_OPEN=0
      - RAKSHA_SERVER_MODE=1
      - RAKSHA_AGENT_TYPE=network
      - RAKSHA_AGENT_ID=${RAKSHA_NETWORK_AGENT_ID:-network-proxy-1}
      - RAKSHA_AGENT_HOSTNAME=${RAKSHA_NETWORK_AGENT_HOSTNAME:-corp-network-proxy}
    ports:
      - "${PROXY_PORT:?set PROXY_PORT in .env}:${PROXY_PORT:?set PROXY_PORT in .env}"
    volumes:
      - ./apps/browser-guard/proxy:/app/proxy
    depends_on:
      - raksha_tech
    restart: unless-stopped

networks:
  # Auto-created bridge network. Works out of the box on any server (no manual 'docker network create' needed).
  default:
    name: ${DOCKER_NETWORK:-raksha-network}
    driver: bridge
  # Existing network the Ollama container runs on, so OLLAMA_URL can use its container name
  # (1Panel apps: 1panel-network). It must exist before `up`; on a server without 1Panel run
  # `docker network create 1panel-network` once or set OLLAMA_DOCKER_NETWORK in .env.
  ollama:
    name: ${OLLAMA_DOCKER_NETWORK:-1panel-network}
    external: true
