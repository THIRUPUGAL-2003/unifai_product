<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YP-Raksha Enterprise AI Guard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      width: 280px;
      background: #0b1220;
      color: #f8fafc;
      padding: 16px 14px;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .brand img {
      width: 24px;
      height: 24px;
      border-radius: 6px;
    }
    .brand-text h1 {
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #ffffff;
      line-height: 1.2;
    }
    .brand-text span {
      font-size: 9.5px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 20px;
      font-size: 10px;
      font-weight: 600;
      color: #34d399;
      transition: all 0.2s ease;
    }
    .status-badge.standby {
      background: rgba(245, 158, 11, 0.12);
      border-color: rgba(245, 158, 11, 0.3);
      color: #fbbf24;
    }
    .status-badge.tampered {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.4);
      color: #f87171;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 2s infinite;
    }
    .status-badge.standby .status-dot {
      background: #f59e0b;
      box-shadow: 0 0 8px #f59e0b;
    }
    .status-badge.tampered .status-dot {
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }
    .hero-card {
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.95) 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 18px 14px;
      text-align: center;
      margin-bottom: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }
    .shield-icon {
      font-size: 36px;
      margin-bottom: 8px;
      display: inline-block;
      filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.45));
      transition: filter 0.3s ease;
    }
    .hero-card.standby .shield-icon {
      filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.45));
    }
    .hero-card.tampered .shield-icon {
      filter: drop-shadow(0 0 10px rgba(239, 68, 68, 0.6));
    }
    .hero-title {
      font-size: 13.5px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }
    .hero-desc {
      font-size: 10.5px;
      color: #94a3b8;
      line-height: 1.4;
    }
    .footer {
      text-align: center;
      font-size: 9.5px;
      color: #64748b;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="icon32.png" alt="YP-Raksha Logo">
      <div class="brand-text">
        <h1>YP-Raksha</h1>
        <span>Enterprise AI Guard</span>
      </div>
    </div>
    <div class="status-badge" id="status-badge">
      <div class="status-dot"></div>
      <span id="badge-text">ACTIVE</span>
    </div>
  </div>

  <div class="hero-card" id="hero-card">
    <div class="shield-icon" id="shield-icon">🛡️</div>
    <div class="hero-title" id="hero-title">Protected & Active</div>
    <div class="hero-desc" id="hero-desc">Connected to YP-Raksha Desktop Agent</div>
  </div>

  <div class="footer">
    YP-Raksha Enterprise Edition • Secured
  </div>

  <script src="endpoint.js"></script>
  <script src="guard_base.js"></script>
  <script src="popup.js"></script>
</body>
</html>
