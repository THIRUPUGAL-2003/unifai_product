<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YP-Raksha Enterprise AI Guard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      width: 320px;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand img {
      width: 26px;
      height: 26px;
      border-radius: 6px;
    }
    .brand-text h1 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #ffffff;
      line-height: 1.2;
    }
    .brand-text span {
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      color: #34d399;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }
    .status-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .status-title {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 6px;
      letter-spacing: 0.03em;
    }
    .status-val {
      font-size: 13px;
      font-weight: 600;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .metric-card {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 9px 10px;
    }
    .metric-num {
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
      line-height: 1.2;
    }
    .metric-lbl {
      font-size: 10px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .features {
      background: rgba(30, 41, 59, 0.4);
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 12px;
    }
    .feature-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      padding: 4px 0;
      color: #cbd5e1;
    }
    .feature-item:not(:last-child) {
      border-bottom: 1px solid rgba(51, 65, 85, 0.5);
    }
    .feature-status {
      color: #10b981;
      font-weight: 600;
      font-size: 10px;
    }
    .btn-sync {
      width: 100%;
      padding: 8px 12px;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease;
    }
    .btn-sync:hover {
      background: #1d4ed8;
    }
    .btn-sync:active {
      transform: scale(0.98);
    }
    .footer {
      margin-top: 10px;
      text-align: center;
      font-size: 9.5px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="icon32.png" alt="YP-Raksha Logo">
      <div class="brand-text">
        <h1>YP-Raksha</h1>
        <span>Enterprise AI Guard</span>
      </div>
    </div>
    <div class="status-badge">
      <div class="status-dot"></div>
      <span id="shield-status">ACTIVE</span>
    </div>
  </div>

  <div class="status-card">
    <div class="status-title">Protection Gateway</div>
    <div class="status-val">
      <span>🛡️</span>
      <span id="gateway-status">Connected (127.0.0.1:18195)</span>
    </div>
  </div>

  <div class="grid">
    <div class="metric-card">
      <div class="metric-num" id="rules-count">15</div>
      <div class="metric-lbl">Active DLP Rules</div>
    </div>
    <div class="metric-card">
      <div class="metric-num" id="sites-count">171+</div>
      <div class="metric-lbl">Monitored AI Sites</div>
    </div>
  </div>

  <div class="features">
    <div class="feature-item">
      <span>Prompt Interception</span>
      <span class="feature-status">● Enabled</span>
    </div>
    <div class="feature-item">
      <span>Files & Images Vision</span>
      <span class="feature-status">● Enabled</span>
    </div>
    <div class="feature-item">
      <span>Clipboard Paste Shield</span>
      <span class="feature-status">● Enabled</span>
    </div>
    <div class="feature-item">
      <span>Real-time WebSockets</span>
      <span class="feature-status">● Enabled</span>
    </div>
  </div>

  <button class="btn-sync" id="btn-sync">
    <span>🔄</span>
    <span id="sync-text">Sync Live Rules</span>
  </button>

  <div class="footer">
    YP-Raksha Enterprise Edition • v1.0.3
  </div>

  <script src="endpoint.js"></script>
  <script src="guard_base.js"></script>
  <script src="popup.js"></script>
</body>
</html>
