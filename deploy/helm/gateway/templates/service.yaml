apiVersion: v1
kind: Service
metadata:
  name: {{ include "gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.gateway.cluster.enabled }}
    - port: {{ .Values.gateway.cluster.gossip.port }}
      targetPort: gossip
      protocol: TCP
      name: gossip
    - port: {{ .Values.gateway.cluster.gossip.port }}
      targetPort: gossip-udp
      protocol: UDP
      name: gossip-udp
    {{- if .Values.gateway.cluster.grpc }}
    - port: {{ .Values.gateway.cluster.grpc.port }}
      targetPort: grpc
      protocol: TCP
      name: grpc
    {{- end }}
    {{- end }}
  selector:
    {{- include "gateway.serverSelectorLabels" . | nindent 4 }}
