# Configuration: External PostgreSQL (not deployed by Helm)
# Usage: helm install unifai ./unifai -f values-examples/external-postgres.yaml

# Storage configuration
storage:
  mode: postgres
  configStore:
    enabled: true
  logsStore:
    enabled: true

# Use external PostgreSQL
postgresql:
  enabled: false
  external:
    enabled: true
    host: "your-postgres-host.example.com"
    port: 5432
    user: unifai
    password: "your-secure-password"
    database: unifai
    sslMode: require

# No vector store
vectorStore:
  enabled: false
  type: none

# UnifAI configuration
unifai:
  encryptionKey: "your-encryption-key-here"
  client:
    enableLogging: true
  providers: {}
    # Add your provider keys here

