{{- /* StatefulSet is used for: sqlite mode with persistence enabled and no existingClaim */}}
{{- $useStatefulSet := and (eq .Values.storage.mode "sqlite") .Values.storage.persistence.enabled (not .Values.storage.persistence.existingClaim) }}
{{- if $useStatefulSet }}
{{- if not .Values.image.tag }}
{{- fail "ERROR: image.tag is required. Please specify the UnifAI image version (e.g., --set image.tag=v1.3.36). See available tags at https://hub.docker.com/r/unifai/unifai/tags" }}
{{- end }}
{{- include "unifai.validate" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "unifai.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "unifai.labels" . | nindent 4 }}
    {{- with .Values.deploymentLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  serviceName: {{ include "unifai.fullname" . }}-headless
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "unifai.serverSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "unifai.labels" . | nindent 8 }}
        app.kubernetes.io/component: server
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "unifai.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- end }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.unifai.port }}
              protocol: TCP
            {{- if .Values.unifai.cluster.enabled }}
            - name: gossip
              containerPort: {{ .Values.unifai.cluster.gossip.port }}
              protocol: TCP
            - name: gossip-udp
              containerPort: {{ .Values.unifai.cluster.gossip.port }}
              protocol: UDP
            {{- if .Values.unifai.cluster.grpc }}
            - name: grpc
              containerPort: {{ .Values.unifai.cluster.grpc.port }}
              protocol: TCP
            {{- end }}
            {{- end }}
          env:
            - name: APP_DIR
              value: {{ .Values.unifai.appDir | quote }}
            - name: APP_PORT
              value: {{ .Values.unifai.port | quote }}
            - name: APP_HOST
              value: {{ .Values.unifai.host | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.unifai.logLevel | quote }}
            - name: LOG_STYLE
              value: {{ .Values.unifai.logStyle | quote }}
            {{- if .Values.unifai.encryptionKeySecret.name }}
            - name: UNIFAI_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.unifai.encryptionKeySecret.name }}
                  key: {{ .Values.unifai.encryptionKeySecret.key }}
            {{- end }}
            {{- if and .Values.unifai.plugins.semanticCache.enabled .Values.unifai.plugins.semanticCache.secretRef .Values.unifai.plugins.semanticCache.secretRef.name }}
            - name: SEMANTIC_CACHE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.unifai.plugins.semanticCache.secretRef.name }}
                  key: {{ .Values.unifai.plugins.semanticCache.secretRef.key | default "api-key" }}
            {{- end }}
            {{- /* PostgreSQL password from existing secret */ -}}
            {{- if and .Values.postgresql.external.enabled .Values.postgresql.external.existingSecret }}
            - name: UNIFAI_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.external.existingSecret }}
                  key: {{ .Values.postgresql.external.passwordKey | default "password" }}
            {{- else if and .Values.postgresql.enabled (not .Values.postgresql.external.enabled) .Values.postgresql.auth.existingSecret }}
            - name: UNIFAI_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.auth.existingSecret }}
                  key: {{ .Values.postgresql.auth.passwordKey | default "password" }}
            {{- end }}
            {{- /* Redis password from existing secret */ -}}
            {{- if and .Values.vectorStore.enabled (eq .Values.vectorStore.type "redis") .Values.vectorStore.redis.external.enabled .Values.vectorStore.redis.external.existingSecret }}
            - name: UNIFAI_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vectorStore.redis.external.existingSecret }}
                  key: {{ .Values.vectorStore.redis.external.passwordKey | default "password" }}
            {{- end }}
            {{- /* Weaviate API key from existing secret */ -}}
            {{- if and .Values.vectorStore.enabled (eq .Values.vectorStore.type "weaviate") .Values.vectorStore.weaviate.external.enabled .Values.vectorStore.weaviate.external.existingSecret }}
            - name: UNIFAI_WEAVIATE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vectorStore.weaviate.external.existingSecret }}
                  key: {{ .Values.vectorStore.weaviate.external.apiKeyKey | default "api-key" }}
            {{- end }}
            {{- /* Qdrant API key from existing secret */ -}}
            {{- if and .Values.vectorStore.enabled (eq .Values.vectorStore.type "qdrant") .Values.vectorStore.qdrant.external.enabled .Values.vectorStore.qdrant.external.existingSecret }}
            - name: UNIFAI_QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vectorStore.qdrant.external.existingSecret }}
                  key: {{ .Values.vectorStore.qdrant.external.apiKeyKey | default "api-key" }}
            {{- end }}
            {{- /* Pinecone API key from existing secret */ -}}
            {{- if and .Values.vectorStore.enabled (eq .Values.vectorStore.type "pinecone") .Values.vectorStore.pinecone.external.enabled .Values.vectorStore.pinecone.external.existingSecret }}
            - name: UNIFAI_PINECONE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vectorStore.pinecone.external.existingSecret }}
                  key: {{ .Values.vectorStore.pinecone.external.apiKeyKey | default "api-key" }}
            {{- end }}
            {{- /* Object storage credentials from existing secret */ -}}
            {{- if and .Values.storage.logsStore.enabled .Values.storage.logsStore.objectStorage .Values.storage.logsStore.objectStorage.enabled .Values.storage.logsStore.objectStorage.existingSecret }}
            {{- if eq .Values.storage.logsStore.objectStorage.type "s3" }}
            - name: UNIFAI_OBJECT_STORAGE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.logsStore.objectStorage.existingSecret }}
                  key: {{ .Values.storage.logsStore.objectStorage.accessKeyIdKey | default "access-key-id" }}
                  optional: true
            - name: UNIFAI_OBJECT_STORAGE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.logsStore.objectStorage.existingSecret }}
                  key: {{ .Values.storage.logsStore.objectStorage.secretAccessKeyKey | default "secret-access-key" }}
                  optional: true
            - name: UNIFAI_OBJECT_STORAGE_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.logsStore.objectStorage.existingSecret }}
                  key: {{ .Values.storage.logsStore.objectStorage.sessionTokenKey | default "session-token" }}
                  optional: true
            - name: UNIFAI_OBJECT_STORAGE_ROLE_ARN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.logsStore.objectStorage.existingSecret }}
                  key: {{ .Values.storage.logsStore.objectStorage.roleArnKey | default "role-arn" }}
                  optional: true
            {{- end }}
            {{- if eq .Values.storage.logsStore.objectStorage.type "gcs" }}
            - name: UNIFAI_OBJECT_STORAGE_CREDENTIALS_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.logsStore.objectStorage.existingSecret }}
                  key: {{ .Values.storage.logsStore.objectStorage.credentialsJsonKey | default "credentials-json" }}
            {{- end }}
            {{- end }}
            {{- /* Maxim API key from existing secret */ -}}
            {{- if and .Values.unifai.plugins.maxim.enabled .Values.unifai.plugins.maxim.secretRef .Values.unifai.plugins.maxim.secretRef.name }}
            - name: UNIFAI_MAXIM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.unifai.plugins.maxim.secretRef.name }}
                  key: {{ .Values.unifai.plugins.maxim.secretRef.key | default "api-key" }}
            {{- end }}
            {{- /* MCP client connection strings from existing secrets (one per client with secretRef.name set) */ -}}
            {{- if .Values.unifai.mcp.enabled }}
            {{- range $idx, $client := .Values.unifai.mcp.clientConfigs }}
            {{- if and $client.secretRef $client.secretRef.name }}
            - name: UNIFAI_MCP_{{ regexReplaceAll "[^A-Z0-9]+" (upper $client.name) "_" }}_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: {{ $client.secretRef.name }}
                  key: {{ $client.secretRef.connectionStringKey | default "connection-string" }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- /* Governance auth credentials from existing secret */ -}}
            {{- if and .Values.unifai.governance .Values.unifai.governance.authConfig .Values.unifai.governance.authConfig.existingSecret }}
            - name: UNIFAI_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.unifai.governance.authConfig.existingSecret }}
                  key: {{ .Values.unifai.governance.authConfig.usernameKey | default "username" }}
            - name: UNIFAI_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.unifai.governance.authConfig.existingSecret }}
                  key: {{ .Values.unifai.governance.authConfig.passwordKey | default "password" }}
            {{- end }}
            {{- /* Top-level auth credentials from existing secret (reuses same env vars as governance) */ -}}
            {{- if and .Values.unifai.authConfig .Values.unifai.authConfig.existingSecret (not (and .Values.unifai.governance .Values.unifai.governance.authConfig .Values.unifai.governance.authConfig.existingSecret)) }}
            - name: UNIFAI_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.unifai.authConfig.existingSecret }}
                  key: {{ .Values.unifai.authConfig.usernameKey | default "username" }}
            - name: UNIFAI_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.unifai.authConfig.existingSecret }}
                  key: {{ .Values.unifai.authConfig.passwordKey | default "password" }}
            {{- end }}
            {{- /* Provider secrets */ -}}
            {{- range $provider := (.Values.unifai.providerSecrets | keys | sortAlpha) }}
            {{- $secret := index $.Values.unifai.providerSecrets $provider }}
            {{- if and $secret.existingSecret $secret.envVar }}
            - name: {{ $secret.envVar }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secret.existingSecret }}
                  key: {{ $secret.key | default "api-key" }}
            {{- end }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- range $name := keys . | sortAlpha }}
            - name: {{ $name }}
              value: {{ index $.Values.extraEnv $name | quote }}
            {{- end }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.unifai.appDir }}
            - name: config
              mountPath: {{ .Values.unifai.appDir }}/config.json
              subPath: config.json
              readOnly: true
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "unifai.fullname" . }}-config
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- /*
              Keep volumeClaimTemplates labels immutable-safe.
              Do not include unifai.labels here because chart/app version labels
              change between releases and StatefulSet volumeClaimTemplates are immutable.
          */}}
          {{- include "unifai.selectorLabels" . | nindent 10 }}
          app.kubernetes.io/component: server
      spec:
        accessModes:
          - {{ .Values.storage.persistence.accessMode }}
        {{- if .Values.storage.persistence.storageClass }}
        {{- if (eq "-" .Values.storage.persistence.storageClass) }}
        storageClassName: ""
        {{- else }}
        storageClassName: {{ .Values.storage.persistence.storageClass }}
        {{- end }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.storage.persistence.size }}
{{- end }}

